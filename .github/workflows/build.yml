name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned toolchain
        shell: pwsh
        run: ./bootstrap.ps1
      - name: Build with disposable local signing key
        shell: pwsh
        run: ./build.ps1
      - name: Verify source and APK class boundaries
        run: python verify.py --apk build/realme-fullscreen-1.3.apk
      - name: Verify original release APK
        run: python verify.py --apk release/realme-fullscreen-1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: realme-fullscreen-1.3-ci
          path: build/realme-fullscreen-1.3.apk
          if-no-files-found: error
